name: iOS build
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project Afterlight.xcodeproj -scheme Afterlight \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "(error|warning: unreachable):" build.log | sort -u | head -150 || true
          tail -30 build.log
          exit $status
