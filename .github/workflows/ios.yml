name: iOS build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (App Store needs the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $X"; test -n "$X" && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project Afterlight.xcodeproj -scheme Afterlight \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && status=0 || status=$?
          grep -E "(error|warning: unreachable):" build.log | sort -u | head -150 || true
          tail -30 build.log
          exit $status
      - name: Play it by touch in a simulator
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro \(|iPhone 1[5-9] \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator $DEV"
          rm -rf /tmp/afterlight-shots; mkdir -p shots
          xcodebuild test -project Afterlight.xcodeproj -scheme Afterlight -destination "id=$DEV" \
            -derivedDataPath build -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO > test.log 2>&1 && status=0 || status=$?
          grep -E "Test Case .*(passed|failed)|error:|XCTAssert|Executed" test.log | sort -u | tail -40
          cp /tmp/afterlight-shots/*.png shots/ 2>/dev/null || true
          cp test.log shots/ 2>/dev/null || true
          exit $status
      - name: Publish screenshots to the smoke-shots branch
        if: always()
        run: |
          cd shots && git init -q && git checkout -q -b smoke-shots
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Simulator screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" smoke-shots
