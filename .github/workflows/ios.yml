name: iOS build
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (App Store needs the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $X"; test -n "$X" && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project Afterlight.xcodeproj -scheme Afterlight \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && status=0 || status=$?
          grep -E "(error|warning: unreachable):" build.log | sort -u | head -150 || true
          tail -30 build.log
          exit $status
      - name: Launch in a simulator and play the opening
        run: |
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]|iPhone 2" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator $DEV"
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV" -b
          APP=$(find build/Build/Products -name "Afterlight.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          ( sleep 1.5; xcrun simctl io "$DEV" screenshot shots/1-title.png
            sleep 5;  xcrun simctl io "$DEV" screenshot shots/2-candle.png
            sleep 6;  xcrun simctl io "$DEV" screenshot shots/3-digging.png
            sleep 6;  xcrun simctl io "$DEV" screenshot shots/4-later.png ) &
          set +e
          perl -e 'alarm 22; exec @ARGV' xcrun simctl launch --console-pty "$DEV" com.isaactullis.afterlight -smoketest | tee launch.log
          code=${PIPESTATUS[0]}
          wait
          echo "launch exit: $code"
          xcrun simctl spawn "$DEV" log show --last 3m --style compact --predicate 'process == "Afterlight" OR eventMessage CONTAINS[c] "afterlight" OR eventMessage CONTAINS[c] "jetsam"' 2>/dev/null | grep -viE "UIKit|CFNetwork|BackBoard" | tail -60 > syslog.txt || true
          cat syslog.txt | tail -60
          sleep 3; python3 ci/crash.py || true
          cp syslog.txt shots/ 2>/dev/null || true
          if [ "$code" != "142" ] && [ "$code" != "0" ]; then echo "::error::The app exited or crashed during the smoke test"; \
            find ~/Library/Logs/DiagnosticReports -name "Afterlight*" -mmin -5 -exec head -80 {} \; ; exit 1; fi
          grep -q "SMOKE t=19" launch.log || { echo "::error::The app stopped before 20 seconds"; exit 1; }
          grep -q "SMOKE: walked and dug" launch.log || { echo "::error::Smoke test did not finish"; exit 1; }
      - name: Publish screenshots to the smoke-shots branch
        if: always()
        run: |
          cp launch.log shots/ 2>/dev/null || true
          cd shots && git init -q && git checkout -q -b smoke-shots
          git -c user.name=ci -c user.email=ci@local add -A && git -c user.name=ci -c user.email=ci@local commit -qm "Simulator screenshots ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" smoke-shots
