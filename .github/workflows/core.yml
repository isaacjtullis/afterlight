name: Core tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Test AfterlightCore
        working-directory: Packages/AfterlightCore
        env:
          DUMP: "1"
        run: swift test
      - name: Upload map snapshot and playthrough logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapdump
          path: /tmp/mapdump
          if-no-files-found: ignore
