name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: testflight
jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode (App Store needs the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $X"; test -n "$X" && sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Check secrets
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then
            echo "::error::Add ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 in repo Settings > Secrets > Actions"; exit 1
          fi
      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Optional Supabase config
        run: |
          printf 'SUPABASE_HOST = %s\nSUPABASE_ANON_KEY = %s\n' "${{ secrets.SUPABASE_HOST }}" "${{ secrets.SUPABASE_ANON_KEY }}" > Config/Secrets.xcconfig
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Afterlight.xcodeproj -scheme Afterlight \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Afterlight.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive > archive.log 2>&1 || { grep -E "error:" archive.log | sort -u | head -150; tail -40 archive.log; exit 1; }
          tail -20 archive.log
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Afterlight.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
